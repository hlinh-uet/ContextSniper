[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contextsniper"
version = "0.1.0"
description = "Long-term memory infrastructure for AI Agents"
readme = "README.md"
license = { text = "MulanPSL-2.0" }
requires-python = ">=3.11"
authors = [
    { name = "ContextSniper Team" }
]
keywords = ["ai", "agents", "memory", "llm", "rag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Mulan Permissive Software License v2 (MulanPSL-2.0)",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "flask>=3.0,<4",
    "pyagfs>=1.4.0",
    "openai>=1.0.0",
    "httpx[socks]>=0.27.1",
    "apscheduler>=3.10.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

# Claude plugin / MCP runtime used by claude-plugin/ and the ContextSniper SWE runner.
mcp = [
    "mcp>=1.0.0",
]

# SWE-bench runner support. Local env derivation and full validation need this.
swe = [
    "swebench>=3.0.0",
    "pyarrow>=15.0.0",
]

# Vector index providers
opengauss = ["psycopg2-binary>=2.9.0"]
chroma = ["chromadb>=0.4.0"]
sentence-transformers = ["sentence-transformers>=2.0.0"]

# E2E eval dependencies
e2e = [
    "matplotlib>=3.5.0",
    "numpy>=1.21.0",
]

# All extras
all = [
    "contextsniper[opengauss,chroma,sentence-transformers]",
]

[project.urls]
Homepage = "https://github.com/Calluking/ContextSniper"
Documentation = "https://github.com/Calluking/ContextSniper#readme"
Repository = "https://github.com/Calluking/ContextSniper.git"
Issues = "https://github.com/Calluking/ContextSniper/issues"

[tool.hatch.build.targets.wheel]
packages = [
    "core",
    "fs",
    "extraction",
    "commit",
    "index",
    "retrieval",
    "providers",
    "server",
    "session",
]

[tool.hatch.build.targets.sdist]
include = [
    "/README.md",
    "/LICENSE",
    "/core",
    "/fs",
    "/extraction",
    "/commit",
    "/index",
    "/retrieval",
    "/providers",
    "/server",
    "/session",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--tb=short"
markers = [
    "integration: marks tests as integration tests (require AGFS or full setup)",
]

[tool.coverage.run]
source = ["core", "fs", "extraction", "commit", "index", "retrieval", "providers", "server", "session"]
omit = ["tests/*"]

# Ruff linting configuration
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]  # line-length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["core", "fs", "extraction", "commit", "index", "retrieval", "providers", "service"]

# MyPy configuration
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
[[tool.mypy.overrides]]
module = "pyagfs.*"
ignore_missing_imports = true
